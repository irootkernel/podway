schema: podway.procedure/v2
id: sdg-direct-control
version: "1"
name: Direct continuity control
purpose: Keep a non-delegated action stable across supervised delegation changes.
node_definitions:
  work:
    type: action
    title: Record work
    intent: Record the Primary's direct result.
    items:
      - id: result
        type: text
        prompt: Record the result.
        required: true
        min_length: 0
        max_length: 256
        multiline: true
graph:
  entry: work
  nodes:
    - id: work
      use: work
      terminal: true
manual_rework:
  allowed_targets:
    - work
