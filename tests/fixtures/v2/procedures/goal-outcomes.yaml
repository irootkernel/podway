schema: podway.procedure/v2
id: v2gol003-outcomes
version: "2"
name: Goal outcome runtime
purpose: Exercise goal outcome derivation and terminal progression gates.
goal_tracking: true
node_definitions:
  work:
    type: action
    title: Produce evidence
    intent: Record the evidence considered by the goal assessment.
    items:
      - id: result
        type: text
        prompt: Record the result.
        required: true
        max_length: 1000
  assess:
    type: decision
    title: Assess the goal
    objective: Select the outcome determined by the recorded criteria.
    prompt: Which goal outcome applies?
    options:
      - id: achieved
        label: Achieved
      - id: not-achieved
        label: Not achieved
      - id: superseded
        label: Superseded
    reason:
      required: true
    assessment:
      target: session_goal
      outcomes:
        achieved: achieved
        not-achieved: not_achieved
        superseded: superseded
  finish:
    type: action
    title: Finish
    intent: Finish after a fresh goal assessment.
graph:
  entry: perform
  nodes:
    - id: perform
      use: work
      next: decide
    - id: decide
      use: assess
      evidence_from:
        - node: perform
          required: true
          items:
            - result
      routes:
        achieved:
          to: finish
          effect: advance
        not-achieved:
          to: finish
          effect: advance
        superseded:
          to: finish
          effect: advance
    - id: finish
      use: finish
      terminal: true
      skip:
        allowed: true
        reason_required: true
manual_rework:
  allowed_targets:
    - perform
