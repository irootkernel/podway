# G009 release dependency policy. Registry wildcard dependencies are denied.
# Local workspace paths are exempt because Cargo models versionless path dependencies as wildcards.
# Duplicate exceptions are exact, owner=release-engineering, expires=2026-10-18.

[advisories]
ignore = []
yanked = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = [
  { crate = "foldhash@=0.1.5", reason = "owner=release-engineering; expires=2026-10-18; rusqlite/hashlink 0.10 transition" },
  { crate = "hashbrown@=0.15.5", reason = "owner=release-engineering; expires=2026-10-18; rusqlite/hashlink 0.10 transition" },
  { crate = "hashbrown@=0.16.1", reason = "owner=release-engineering; expires=2026-10-18; yaml-rust2/hashlink 0.11 transition" },
  { crate = "hashlink@=0.10.0", reason = "owner=release-engineering; expires=2026-10-18; rusqlite 0.34 transition" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
