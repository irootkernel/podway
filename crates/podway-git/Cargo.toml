[package]
name = "podway-git"
version = "0.2.2"
edition = "2024"
license = "MIT"
publish = false
autotests = false

[dependencies]
podway-core = { path = "../podway-core" }
sha2.workspace = true
uuid.workspace = true
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
libc = "0.2"
tempfile.workspace = true

[[test]]
name = "arch_phase0_contract"
path = "tests/arch_phase0_contract.rs"

[[test]]
name = "int_suite"
path = "tests/int_suite.rs"
