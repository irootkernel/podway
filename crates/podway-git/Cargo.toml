[package]
name = "podway-git"
version = "0.2.18"
edition = "2024"
rust-version.workspace = true
license = "MIT"
publish = false
autotests = false

[features]
test-support = []

[dependencies]
podway-core = { path = "../podway-core" }
sha2.workspace = true
uuid.workspace = true
rustix = { version = "1.1.6", features = ["fs"] }

[dev-dependencies]
libc = "0.2"
tempfile.workspace = true

[[test]]
name = "arch_phase0_contract"
path = "tests/arch_phase0_contract.rs"

[[test]]
name = "int_suite"
path = "tests/int_suite.rs"
