[package]
name = "podway-protocol"
version = "0.2.5"
edition = "2024"
license = "MIT"
publish = false
autotests = false

[dependencies]
podway-core = { path = "../podway-core" }
serde.workspace = true
serde_json.workspace = true
jsonschema = { version = "0.49.2", default-features = false }
sha2 = { workspace = true, optional = true }

[features]
release-contract-verifier = ["dep:sha2"]

[build-dependencies]
serde_json.workspace = true
sha2.workspace = true

[[test]]
name = "arch_phase0_contract"
path = "tests/arch_phase0_contract.rs"

[[test]]
name = "int_suite"
path = "tests/int_suite.rs"

[dev-dependencies]
jsonschema = { version = "0.49.2", default-features = false }
serde_yaml.workspace = true
sha2.workspace = true
tempfile.workspace = true

[[bin]]
name = "podway-contract-verifier"
path = "src/bin/podway-contract-verifier.rs"
required-features = ["release-contract-verifier"]
