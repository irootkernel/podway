[package]
name = "podway-cli"
version = "0.2.12"
edition = "2024"
license = "MIT"
publish = false

autobins = false
autotests = false

[dependencies]
podway-core = { path = "../podway-core" }
podway-protocol = { path = "../podway-protocol" }
podway-config = { path = "../podway-config" }
podway-presets = { path = "../podway-presets" }
podway-engine = { path = "../podway-engine" }
clap = { workspace = true }
nix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true }
sha2 = { workspace = true }

[[bin]]
name = "podway"
path = "src/main.rs"

[[test]]
name = "arch_phase0_contract"
path = "tests/arch_phase0_contract.rs"

[[test]]
name = "e2e_suite"
path = "tests/e2e_suite.rs"
