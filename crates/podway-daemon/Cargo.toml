[package]
name = "podway-daemon"
version = "0.2.1"
edition = "2024"
license = "MIT"
publish = false

autobins = false
autotests = false

[features]
default = []
development-v2-admission = []

[dependencies]
podway-core = { path = "../podway-core" }
podway-protocol = { path = "../podway-protocol" }
podway-config = { path = "../podway-config" }
podway-store = { path = "../podway-store" }
podway-git = { path = "../podway-git" }
podway-service = { path = "../podway-service" }
podway-presets = { path = "../podway-presets" }
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
signal-hook.workspace = true
uuid.workspace = true

[[bin]]
name = "podwayd"
path = "src/main.rs"

[[test]]
name = "arch_phase0_contract"
path = "tests/arch_phase0_contract.rs"

[[test]]
name = "int_suite"
path = "tests/int_suite.rs"
