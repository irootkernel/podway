schema: podway.procedure/v1
id: analysis
version: "1"
name: Analysis
description: Bounded research or technical analysis with explicit challenge and synthesis.
stages:
  - id: define-question
    title: Define the question
    items:
      - id: analysis-question
        type: text
        prompt: State the question to be answered.
        required: true
        min_length: 1
      - id: decision-context
        type: text
        prompt: Describe the decision or use that the analysis should support.
        required: true
        min_length: 1
      - id: scope-and-constraints
        type: text
        prompt: Define scope, assumptions, and constraints.
        required: true
        min_length: 1
  - id: collect-sources
    title: Collect sources
    items:
      - id: sources
        type: list
        prompt: List the sources or inputs used.
        required: true
        min_items: 2
        max_items: 200
      - id: source-limitations
        type: text
        prompt: Record material source limitations or gaps.
        required: true
        min_length: 1
  - id: analyze
    title: Analyze the evidence
    items:
      - id: analysis-complete
        type: confirm
        prompt: The collected inputs were analyzed against the stated question.
        required: true
      - id: key-findings
        type: list
        prompt: List the key findings.
        required: true
        min_items: 1
        max_items: 100
      - id: assumptions
        type: list
        prompt: List material assumptions used in the analysis.
        required: true
        min_items: 1
        max_items: 100
  - id: challenge
    title: Challenge the analysis
    items:
      - id: challenge-complete
        type: confirm
        prompt: The analysis was challenged for counterarguments, alternative explanations, and missing evidence.
        required: true
      - id: counterarguments
        type: list
        prompt: List material counterarguments or alternative explanations.
        required: true
        min_items: 1
        max_items: 100
      - id: uncertainty
        type: text
        prompt: Describe uncertainty and what could change the conclusion.
        required: true
        min_length: 1
  - id: synthesize
    title: Synthesize the result
    items:
      - id: conclusion
        type: text
        prompt: State the supported conclusion.
        required: true
        min_length: 1
      - id: recommendation
        type: text
        prompt: State the recommended action or next decision.
        required: true
        min_length: 1
      - id: confidence
        type: choice
        prompt: Select confidence in the conclusion.
        required: true
        choices: [low, medium, high]
  - id: finish
    title: Finish the analysis
    items:
      - id: result-ready
        type: confirm
        prompt: The analysis result is ready to deliver.
        required: true
      - id: final-summary
        type: text
        prompt: Summarize the result, recommendation, and principal uncertainty.
        required: true
        min_length: 1
rework:
  allow_return_to: any_previous
