schema: podway.procedure/v2
id: bug-fix-v2
version: "2"
name: Bug Fix v2
purpose: Correct a reproduced defect with fresh regression, verification, and review evidence.
description: A bounded full-feature bug-fix procedure with explicit rework and goal-directed closeout.
goal_tracking: true
node_definitions:
  reproduce-defect:
    type: action
    title: Reproduce the defect
    intent: Establish the observed and expected behavior before changing the implementation.
    instructions:
      - Reproduce the defect or record why reproduction is not currently possible.
      - Keep the observation separate from the expected behavior.
    items:
      - id: reproduction-status
        type: choice
        prompt: Record whether the defect was reproduced.
        required: true
        choices:
          - reproduced
          - not-reproduced
      - id: observed-behavior
        type: text
        prompt: Record the observed behavior or the reproduction limitation.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: expected-behavior
        type: text
        prompt: Record the expected behavior.
        required: true
        min_length: 1
        max_length: 2000
        multiline: true
  diagnose-cause:
    type: action
    title: Diagnose the cause
    intent: Identify the defect mechanism and the narrowest safe correction.
    instructions:
      - Inspect the relevant implementation and authoritative contracts.
      - Record the causal explanation and affected boundary.
    items:
      - id: cause
        type: text
        prompt: Record the diagnosed cause.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: affected-boundary
        type: text
        prompt: Record the affected component or contract boundary.
        required: true
        min_length: 1
        max_length: 1000
        multiline: true
  regression-case:
    type: action
    title: Establish the regression case
    intent: Define a check that distinguishes the defect from the corrected behavior.
    instructions:
      - Add or identify the narrowest regression check that fails for the diagnosed reason.
    items:
      - id: regression-check
        type: text
        prompt: Record the regression test or validation command.
        required: true
        min_length: 1
        max_length: 2000
        multiline: true
      - id: failing-baseline
        type: text
        prompt: Record the failing baseline or why a pre-fix failure cannot be executed.
        required: true
        min_length: 1
        max_length: 2000
        multiline: true
  implement-fix:
    type: action
    title: Implement the fix
    intent: Correct the diagnosed cause without unrelated changes.
    instructions:
      - Implement only the defect correction and its direct verification.
      - Record the resulting source revision.
    items:
      - id: fix-summary
        type: text
        prompt: Summarize the implemented correction.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: source-revision
        type: text
        prompt: Record the resulting source revision.
        required: true
        min_length: 1
        max_length: 256
        multiline: true
  verify-fix:
    type: action
    title: Verify the fix
    intent: Produce fresh evidence that the regression is corrected without breaking the required boundary.
    instructions:
      - Run the regression check and the required surrounding verification outside Podway.
      - Record the command, exit status, and log digest.
    items:
      - id: verification-command
        type: text
        prompt: Record the exact verification command.
        required: true
        min_length: 1
        max_length: 2000
        multiline: true
      - id: verification-exit-status
        type: integer
        prompt: Record the verification exit status.
        required: true
      - id: verification-log-digest
        type: text
        prompt: Record the digest of the verification log.
        required: true
        min_length: 1
        max_length: 128
        multiline: true
  evaluate-verification:
    type: decision
    title: Evaluate the verification
    objective: Only a correction supported by acceptable fresh verification may proceed.
    prompt: Does the recorded verification support the correction?
    evidence_guidance:
      - Read the verification command, exit status, and log digest.
      - Compare the result with the recorded regression case.
    options:
      - id: passed
        label: Verification passed
        criteria: The regression and required surrounding checks completed successfully.
      - id: failed
        label: Verification failed
        criteria: The recorded verification does not support the correction.
    reason:
      required: true
      prompt: Explain the selection using the referenced verification evidence.
  review-fix:
    type: action
    title: Review the fix
    intent: Review the verified correction against the diagnosis, task goal, and regression risk.
    instructions:
      - Review the correction and its fresh verification evidence.
      - Record unresolved correctness or scope findings.
    items:
      - id: review-summary
        type: text
        prompt: Summarize the review result.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: review-findings
        type: list
        prompt: List unresolved review findings, if any.
        required: false
        min_items: 0
        max_items: 50
        max_item_length: 500
        unique: true
  evaluate-review:
    type: decision
    title: Evaluate the review
    objective: A correction with unresolved review findings must return to implementation.
    prompt: Is the reviewed correction ready for goal assessment?
    evidence_guidance:
      - Read the review summary and unresolved findings.
    options:
      - id: approved
        label: Review approved
        criteria: The review records no unresolved finding that blocks closeout.
      - id: changes-requested
        label: Changes requested
        criteria: At least one unresolved finding requires another implementation attempt.
    reason:
      required: true
      prompt: Explain the selection using the referenced review evidence.
  assess-goal:
    type: decision
    title: Assess the session goal
    objective: Record whether the current bug-fix goal revision is supported by fresh evidence.
    prompt: What is the outcome of the current session goal?
    evidence_guidance:
      - Read the latest verification evidence and approved review summary.
      - Assess every criterion of the current goal revision.
    items:
      - id: assessment-note
        type: text
        prompt: Record observations supporting the criterion assessments.
        required: false
        min_length: 0
        max_length: 2000
        multiline: true
    options:
      - id: achieved
        label: Goal achieved
        criteria: Fresh criterion assessments support the corrected behavior.
      - id: not-achieved
        label: Goal not achieved
        criteria: Fresh criterion assessments do not support the corrected behavior.
      - id: superseded
        label: Goal superseded
        criteria: The current bug-fix goal revision is no longer the desired outcome.
    reason:
      required: true
      prompt: Explain the outcome using the criterion results and evidence.
    assessment:
      target: session_goal
      outcomes:
        achieved: achieved
        not-achieved: not_achieved
        superseded: superseded
  finalize-outcome:
    type: action
    title: Finalize the assessed outcome
    intent: Record the defect outcome and any follow-up required by the assessment.
    items:
      - id: outcome-note
        type: text
        prompt: Record the outcome and follow-up commitments.
        required: true
        min_length: 1
        max_length: 2000
        multiline: true
  confirm-outcome:
    type: decision
    title: Confirm the assessed outcome
    objective: Only a bug-fix outcome consistent with its assessment may close.
    prompt: Is the recorded outcome ready for final closeout?
    evidence_guidance:
      - Compare the outcome note with the goal assessment and approved review.
    options:
      - id: ready
        label: Ready to close
        criteria: The outcome record is consistent with the assessment.
      - id: incomplete
        label: Outcome incomplete
        criteria: The outcome record is missing or contradicts the assessment.
    reason:
      required: true
      prompt: Explain the selection using the referenced evidence.
  closeout:
    type: action
    title: Record the closeout
    intent: Produce the final defect-correction closeout.
    items:
      - id: closeout-note
        type: text
        prompt: Record the final closeout.
        required: true
        min_length: 1
        max_length: 2000
        multiline: true
graph:
  entry: reproduce
  nodes:
    - id: reproduce
      use: reproduce-defect
      next: diagnose
    - id: diagnose
      use: diagnose-cause
      evidence_from:
        - node: reproduce
          required: true
      next: establish-regression
    - id: establish-regression
      use: regression-case
      evidence_from:
        - node: reproduce
          required: true
        - node: diagnose
          required: true
      next: implement
    - id: implement
      use: implement-fix
      evidence_from:
        - node: diagnose
          required: true
        - node: establish-regression
          required: true
      next: verify
    - id: verify
      use: verify-fix
      evidence_from:
        - node: establish-regression
          required: true
        - node: implement
          required: true
      next: decide-verification
    - id: decide-verification
      use: evaluate-verification
      evidence_from:
        - node: establish-regression
          required: true
        - node: verify
          required: true
      routes:
        passed:
          to: review
          effect: advance
        failed:
          to: implement
          effect: rework
    - id: review
      use: review-fix
      evidence_from:
        - node: implement
          required: true
        - node: verify
          required: true
      next: decide-review
    - id: decide-review
      use: evaluate-review
      evidence_from:
        - node: review
          required: true
      routes:
        approved:
          to: assess-session-goal
          effect: advance
        changes-requested:
          to: implement
          effect: rework
    - id: assess-session-goal
      use: assess-goal
      evidence_from:
        - node: verify
          required: true
        - node: review
          required: true
          items:
            - review-summary
      routes:
        achieved:
          to: finish-achieved
          effect: advance
        not-achieved:
          to: finish-not-achieved
          effect: advance
        superseded:
          to: finish-superseded
          effect: advance
    - id: finish-achieved
      use: finalize-outcome
      next: confirm-closeout
    - id: finish-not-achieved
      use: finalize-outcome
      next: confirm-closeout
    - id: finish-superseded
      use: finalize-outcome
      next: confirm-closeout
    - id: confirm-closeout
      use: confirm-outcome
      evidence_from:
        - node: assess-session-goal
          required: true
        - node: review
          required: true
          items:
            - review-summary
        - node: finish-achieved
          required: false
        - node: finish-not-achieved
          required: false
        - node: finish-superseded
          required: false
      routes:
        ready:
          to: record-closeout
          effect: advance
        incomplete:
          to: assess-session-goal
          effect: rework
    - id: record-closeout
      use: closeout
      terminal: true
manual_rework:
  allowed_targets:
    - reproduce
    - diagnose
    - establish-regression
    - implement
    - verify
    - review
