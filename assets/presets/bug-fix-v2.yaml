schema: podway.procedure/v2
id: bug-fix-v2
version: "3"
name: Bug Fix v2
purpose: Correct a defect with fresh structurally bound verification and guarded review evidence.
description: The middle reference Procedure for a reproduced defect, typed verification, guarded rework, and goal-directed closeout.
goal_tracking: true
node_definitions:
  reproduction:
    type: action
    title: Reproduce the defect
    intent: Establish the observed behavior, expected behavior, and regression boundary before diagnosis.
    instructions:
      - Reproduce the defect or record why reproduction is not currently possible.
      - Record the behavior and regression check in English.
    items:
      - id: reproduction-status
        type: choice
        prompt: Record whether the defect was reproduced.
        required: true
        choices:
          - reproduced
          - not-reproduced
      - id: observed-behavior
        type: text
        prompt: Record the observed behavior or reproduction limitation in English.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: expected-behavior
        type: text
        prompt: Record the expected behavior in English.
        required: true
        min_length: 1
        max_length: 2000
        multiline: true
      - id: regression-check
        type: text
        prompt: Record the regression check in English, preserving exact commands verbatim.
        required: true
        min_length: 1
        max_length: 2000
        multiline: true
  diagnosis:
    type: action
    title: Diagnose the cause
    intent: Identify the defect mechanism and the narrowest safe correction.
    instructions:
      - Inspect the relevant implementation and authoritative contracts.
      - Record the causal explanation and affected boundary in English.
    items:
      - id: cause
        type: text
        prompt: Record the diagnosed cause in English.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: affected-boundary
        type: text
        prompt: Record the affected component or contract boundary in English.
        required: true
        min_length: 1
        max_length: 1000
        multiline: true
  implementation:
    type: action
    title: Implement the fix
    intent: Correct the diagnosed cause without unrelated changes.
    instructions:
      - Implement only the defect correction and its direct verification.
      - Record the fix and changed boundaries in English.
    items:
      - id: fix-summary
        type: text
        prompt: Summarize the implemented correction in English.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: changed-boundaries
        type: list
        prompt: List the changed product or contract boundaries in English.
        required: true
        min_items: 1
        max_items: 20
        max_item_length: 500
        max_total_length: 10000
        unique: true
  verification:
    type: action
    title: Verify the fix
    intent: Record a structurally bound external result for the current bug-fix candidate.
    instructions:
      - Run the declared regression check and repository-authoritative surrounding verification outside Podway.
      - Record the caller-supplied result in English; Podway does not execute or attest the operation.
    items:
      - id: verification-result
        type: check_result
        prompt: Record the caller-supplied result for bug-fix-verification; Podway does not execute or attest the operation.
        help: The declared operation is "Run the declared regression check and the repository-authoritative surrounding verification for the current bug fix in the recorded input basis." The matching digest identifies only this abstract slot contract and does not prove that any operation ran.
        required: true
        operation_id: bug-fix-verification
        operation_digest: sha256:01122b6057efcfa3f22c453aa48fb647ccba9f7db437dd44473a9f32a854a979
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  verification-decision:
    type: decision
    title: Evaluate the verification result
    objective: Route the recorded candidate by its structurally bound external outcome.
    prompt: Does the current verification result permit review?
    evidence_guidance:
      - Read the selected result and compare its input basis with the current fix.
    options:
      - id: passed
        label: Verification passed
        criteria: The selected verification outcome is pass.
        guards:
          - evidence:
              node: verify
              item: verification-result
            field: outcome
            equals: pass
      - id: retry
        label: Verification retry required
        criteria: The selected verification outcome is fail or inconclusive.
        guards:
          - evidence:
              node: verify
              item: verification-result
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Explain the selection using the recorded result in English.
  review-work:
    type: action
    title: Review the verified fix
    intent: Record the review result and bounded unresolved findings.
    instructions:
      - Review the diagnosis, fix, fresh verification, and goal boundary.
      - Record the summary, exact unresolved count, and findings in English.
    items:
      - id: review-summary
        type: text
        prompt: Summarize the review result in English.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: unresolved-valid-findings
        type: integer
        prompt: Record the number of unresolved valid findings.
        required: true
        minimum: 0
      - id: review-findings
        type: list
        prompt: List bounded unresolved review findings in English, if any.
        required: false
        min_items: 0
        max_items: 20
        max_item_length: 500
        max_total_length: 10000
        unique: true
  review-decision:
    type: decision
    title: Evaluate the review result
    objective: Route the fix by its exact non-negative unresolved finding count.
    prompt: Is the reviewed fix ready for goal assessment?
    evidence_guidance:
      - Read the selected summary, unresolved count, and findings.
    options:
      - id: approved
        label: Review approved
        criteria: No unresolved valid finding remains.
        guards:
          - evidence:
              node: review
              item: unresolved-valid-findings
            equals: 0
      - id: changes-requested
        label: Changes requested
        criteria: At least one unresolved valid finding remains.
        guards:
          - evidence:
              node: review
              item: unresolved-valid-findings
            at_least: 1
    reason:
      required: true
      prompt: Explain the selected route in English.
  assess-goal:
    type: decision
    title: Assess the session goal
    objective: Determine whether fresh reproduction, verification, and review evidence supports the bug-fix goal.
    prompt: What is the outcome of the current session goal?
    evidence_guidance:
      - Assess every criterion against the selected fresh evidence and decision records.
    items:
      - id: assessment-note
        type: text
        prompt: Record observations supporting the criterion assessments in English.
        required: false
        min_length: 0
        max_length: 2000
        multiline: true
    options:
      - id: achieved
        label: Goal achieved
        criteria: Fresh criterion assessments support the corrected behavior.
      - id: not-achieved
        label: Goal not achieved
        criteria: Fresh evidence does not support the corrected behavior.
      - id: superseded
        label: Goal superseded
        criteria: The current bug-fix goal revision is no longer desired.
    reason:
      required: true
      prompt: Explain the outcome using criterion assessments and evidence in English.
    assessment:
      target: session_goal
      outcomes:
        achieved: achieved
        not-achieved: not_achieved
        superseded: superseded
  closeout:
    type: action
    title: Record the closeout
    intent: Record the terminal outcome for the assessed bug-fix goal.
    items:
      - id: closeout-note
        type: text
        prompt: Record the final closeout in English.
        required: true
        min_length: 1
        max_length: 2000
        multiline: true
graph:
  entry: reproduce
  nodes:
    - id: reproduce
      use: reproduction
      next: diagnose
    - id: diagnose
      use: diagnosis
      evidence_from:
        - node: reproduce
          required: true
          items:
            - reproduction-status
            - observed-behavior
            - expected-behavior
            - regression-check
      next: implement
    - id: implement
      use: implementation
      evidence_from:
        - node: reproduce
          required: true
          items:
            - regression-check
        - node: diagnose
          required: true
          items:
            - cause
            - affected-boundary
      next: verify
    - id: verify
      use: verification
      evidence_from:
        - node: implement
          required: true
          items:
            - fix-summary
            - changed-boundaries
      next: evaluate-verification
    - id: evaluate-verification
      use: verification-decision
      evidence_from:
        - node: verify
          required: true
          items:
            - verification-result
      routes:
        passed:
          to: review
          effect: advance
        retry:
          to: implement
          effect: rework
    - id: review
      use: review-work
      evidence_from:
        - node: diagnose
          required: true
          items:
            - cause
            - affected-boundary
        - node: implement
          required: true
          items:
            - fix-summary
            - changed-boundaries
        - node: verify
          required: true
          items:
            - verification-result
      next: evaluate-review
    - id: evaluate-review
      use: review-decision
      evidence_from:
        - node: review
          required: true
          items:
            - review-summary
            - unresolved-valid-findings
            - review-findings
      routes:
        approved:
          to: assess-goal
          effect: advance
        changes-requested:
          to: implement
          effect: rework
    - id: assess-goal
      use: assess-goal
      evidence_from:
        - node: reproduce
          required: true
          items:
            - observed-behavior
            - expected-behavior
            - regression-check
        - node: verify
          required: true
          items:
            - verification-result
        - node: evaluate-review
          required: true
        - node: review
          required: true
          items:
            - review-summary
            - unresolved-valid-findings
      routes:
        achieved:
          to: closeout
          effect: advance
        not-achieved:
          to: closeout
          effect: advance
        superseded:
          to: closeout
          effect: advance
    - id: closeout
      use: closeout
      evidence_from:
        - node: assess-goal
          required: true
      terminal: true
manual_rework:
  allowed_targets:
    - reproduce
    - diagnose
    - implement
    - verify
    - review
