schema: podway.procedure/v2
id: sw-dev-v2
version: "3"
name: Software Development v2
purpose: Deliver a reviewed software change with bounded planning and fresh external verification evidence.
description: The full reference Procedure for guarded verification, documentation, review, and goal-directed closeout.
goal_tracking: true
node_definitions:
  planning:
    type: action
    title: Plan the change
    intent: Bound the implementation before changing the product.
    instructions:
      - Inspect the relevant implementation, tests, and authoritative contracts.
      - Record the agreed scope, measurable success criteria, and material risks in English.
    items:
      - id: scope-summary
        type: text
        prompt: Record the bounded change scope in English.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: success-criteria
        type: list
        prompt: Record the measurable success criteria in English.
        required: true
        min_items: 1
        max_items: 50
        max_item_length: 500
        max_total_length: 25000
        unique: true
      - id: risk-summary
        type: text
        prompt: Record the material risks and compatibility boundaries in English.
        required: true
        min_length: 1
        max_length: 2000
        multiline: true
  implementation:
    type: action
    title: Implement the change
    intent: Produce the smallest complete implementation for the recorded plan.
    instructions:
      - Implement only the agreed scope.
      - Record the implementation and affected boundaries in English.
    items:
      - id: implementation-summary
        type: text
        prompt: Summarize the implemented change in English.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: changed-boundaries
        type: list
        prompt: List the changed product, contract, or verification boundaries in English.
        required: true
        min_items: 1
        max_items: 50
        max_item_length: 500
        max_total_length: 25000
        unique: true
  verification:
    type: action
    title: Verify the change
    intent: Record a structurally bound external result for the implemented candidate.
    instructions:
      - Run the repository-authoritative verification outside Podway.
      - Record the caller-supplied result and any required observations in English.
    items:
      - id: verification-result
        type: check_result
        prompt: Record the caller-supplied result for software-change-verification; Podway does not execute or attest the operation.
        help: The declared operation is "Run the repository-authoritative verification required for the current software change in the recorded input basis." The matching digest identifies only this abstract slot contract and does not prove that any operation ran.
        required: true
        operation_id: software-change-verification
        operation_digest: sha256:b904aefd4dbd6b01337645fd34b1424efc9faf3d22c936de666305335076969e
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
      - id: verification-observations
        type: list
        prompt: Record failure or inconclusive observations in English.
        required: false
        required_when:
          - item: verification-result
            field: outcome
            not_equals: pass
        min_items: 1
        max_items: 20
        max_item_length: 500
        max_total_length: 10000
        unique: true
      - id: verification-report
        type: artifact
        prompt: Attach optional metadata for a repository-local verification report.
        help: Podway records caller-supplied metadata only and does not store, inspect, or attest the artifact bytes.
        required: false
        allowed_media_types:
          - text/plain
          - application/json
          - application/xml
  verification-decision:
    type: decision
    title: Evaluate the verification result
    objective: Route the recorded candidate by its structurally bound external outcome.
    prompt: Does the current verification result permit documentation?
    evidence_guidance:
      - Read the selected result, conditional observations, and optional report metadata.
    options:
      - id: acceptable
        label: Verification acceptable
        criteria: The selected verification outcome is pass.
        guards:
          - evidence:
              node: verify
              item: verification-result
            field: outcome
            equals: pass
      - id: retry
        label: Verification retry required
        criteria: The selected verification outcome is fail or inconclusive.
        guards:
          - evidence:
              node: verify
              item: verification-result
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Explain the selection using the recorded result in English.
  documentation:
    type: action
    title: Document the change
    intent: Record whether the implemented behavior requires durable documentation updates.
    instructions:
      - Select an explicit documentation state instead of skipping this phase.
      - Record the update summary in English when documentation changed.
    items:
      - id: documentation-state
        type: choice
        prompt: Record the documentation state.
        required: true
        choices:
          - not-applicable
          - updated
      - id: documentation-summary
        type: text
        prompt: Summarize the durable documentation update in English.
        required: false
        required_when:
          - item: documentation-state
            equals: updated
        min_length: 1
        max_length: 4000
        multiline: true
  review-work:
    type: action
    title: Review the verified change
    intent: Record separate implementation and documentation findings for phase-owner routing.
    instructions:
      - Review the plan, implementation, verification, and documentation evidence.
      - Record the summary, exact unresolved counts, and bounded findings in English.
    items:
      - id: review-summary
        type: text
        prompt: Summarize the review result in English.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: unresolved-implementation-findings
        type: integer
        prompt: Record the number of unresolved implementation findings.
        required: true
        minimum: 0
      - id: unresolved-documentation-findings
        type: integer
        prompt: Record the number of unresolved documentation findings.
        required: true
        minimum: 0
      - id: review-findings
        type: list
        prompt: List bounded unresolved review findings in English, if any.
        required: false
        min_items: 0
        max_items: 100
        max_item_length: 4000
        max_total_length: 400000
        unique: true
  review-decision:
    type: decision
    title: Evaluate the review result
    objective: Route each unresolved finding to the phase that owns its correction.
    prompt: Which phase owns the current review outcome?
    evidence_guidance:
      - Read the selected summary, unresolved counts, and findings.
      - Implementation findings take precedence over documentation findings.
    options:
      - id: approved
        label: Review approved
        criteria: No unresolved implementation or documentation finding remains.
        guards:
          - evidence:
              node: review
              item: unresolved-implementation-findings
            equals: 0
          - evidence:
              node: review
              item: unresolved-documentation-findings
            equals: 0
      - id: implementation-changes
        label: Implementation changes required
        criteria: At least one unresolved implementation finding remains.
        guards:
          - evidence:
              node: review
              item: unresolved-implementation-findings
            at_least: 1
      - id: documentation-changes
        label: Documentation changes required
        criteria: No implementation finding remains and at least one documentation finding remains.
        guards:
          - evidence:
              node: review
              item: unresolved-implementation-findings
            equals: 0
          - evidence:
              node: review
              item: unresolved-documentation-findings
            at_least: 1
    reason:
      required: true
      prompt: Explain the selected phase-owner route in English.
  assess-goal:
    type: decision
    title: Assess the session goal
    objective: Determine whether fresh implementation, verification, and review evidence supports the goal.
    prompt: What is the outcome of the current session goal?
    evidence_guidance:
      - Assess every criterion against the selected fresh evidence and decision records.
    items:
      - id: assessment-note
        type: text
        prompt: Record observations supporting the criterion assessments in English.
        required: false
        min_length: 0
        max_length: 2000
        multiline: true
    options:
      - id: achieved
        label: Goal achieved
        criteria: Fresh criterion assessments support the current goal revision.
      - id: not-achieved
        label: Goal not achieved
        criteria: Fresh evidence does not support the current goal revision.
      - id: superseded
        label: Goal superseded
        criteria: The current goal revision is no longer desired.
    reason:
      required: true
      prompt: Explain the outcome using criterion assessments and evidence in English.
    assessment:
      target: session_goal
      outcomes:
        achieved: achieved
        not-achieved: not_achieved
        superseded: superseded
  closeout:
    type: action
    title: Record the closeout
    intent: Record the terminal outcome for the assessed goal.
    items:
      - id: closeout-note
        type: text
        prompt: Record the final closeout in English.
        required: true
        min_length: 1
        max_length: 2000
        multiline: true
graph:
  entry: plan
  nodes:
    - id: plan
      use: planning
      next: implement
    - id: implement
      use: implementation
      evidence_from:
        - node: plan
          required: true
          items:
            - scope-summary
            - success-criteria
            - risk-summary
      next: verify
    - id: verify
      use: verification
      evidence_from:
        - node: implement
          required: true
          items:
            - implementation-summary
            - changed-boundaries
      next: evaluate-verification
    - id: evaluate-verification
      use: verification-decision
      evidence_from:
        - node: verify
          required: true
          items:
            - verification-result
            - verification-observations
            - verification-report
      routes:
        acceptable:
          to: document
          effect: advance
        retry:
          to: implement
          effect: rework
    - id: document
      use: documentation
      evidence_from:
        - node: implement
          required: true
          items:
            - implementation-summary
            - changed-boundaries
        - node: evaluate-verification
          required: true
      next: review
    - id: review
      use: review-work
      evidence_from:
        - node: plan
          required: true
          items:
            - scope-summary
            - success-criteria
            - risk-summary
        - node: implement
          required: true
          items:
            - implementation-summary
            - changed-boundaries
        - node: verify
          required: true
          items:
            - verification-result
            - verification-observations
            - verification-report
        - node: document
          required: true
          items:
            - documentation-state
            - documentation-summary
      next: evaluate-review
    - id: evaluate-review
      use: review-decision
      evidence_from:
        - node: review
          required: true
          items:
            - review-summary
            - unresolved-implementation-findings
            - unresolved-documentation-findings
            - review-findings
      routes:
        approved:
          to: assess-goal
          effect: advance
        implementation-changes:
          to: implement
          effect: rework
        documentation-changes:
          to: document
          effect: rework
    - id: assess-goal
      use: assess-goal
      evidence_from:
        - node: plan
          required: true
          items:
            - success-criteria
        - node: verify
          required: true
          items:
            - verification-result
        - node: evaluate-verification
          required: true
        - node: review
          required: true
          items:
            - review-summary
            - unresolved-implementation-findings
            - unresolved-documentation-findings
            - review-findings
        - node: evaluate-review
          required: true
      routes:
        achieved:
          to: closeout
          effect: advance
        not-achieved:
          to: closeout
          effect: advance
        superseded:
          to: closeout
          effect: advance
    - id: closeout
      use: closeout
      evidence_from:
        - node: assess-goal
          required: true
      terminal: true
manual_rework:
  allowed_targets:
    - plan
    - implement
    - verify
    - document
    - review
