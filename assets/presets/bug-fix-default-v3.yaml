schema: podway.execution-group/v1
id: bug-fix-default-v3
version: "1"
name: Bug Fix default execution group
purpose: Correct a defect with fresh structurally bound verification and guarded review evidence.
node_definitions:
  diagnosis:
    type: action
    title: Diagnose the cause
    intent: Identify the defect mechanism and the narrowest safe correction.
    instructions:
      - "Accountable role: Task Operator. Use the current selected evidence and record the declared outputs against that basis."
      - Inspect the relevant implementation and authoritative contracts.
      - Record the causal explanation and affected boundary in English.
      - Report actual negative or incomplete results in the declared output fields. If a required result cannot be supplied, record a blocker with the missing facts.
    items:
      - id: cause
        type: text
        prompt: Record the diagnosed cause in English.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: affected-boundary
        type: text
        prompt: Record the affected component or contract boundary in English.
        required: true
        min_length: 1
        max_length: 1000
        multiline: true
  implementation:
    type: action
    title: Implement the fix
    intent: Correct the diagnosed cause without unrelated changes.
    instructions:
      - "Accountable role: Task Operator. Use the current selected evidence and record the declared outputs against that basis."
      - Implement only the defect correction and its direct verification.
      - Record the fix and changed boundaries in English.
      - Report actual negative or incomplete results in the declared output fields. If a required result cannot be supplied, record a blocker with the missing facts.
    items:
      - id: fix-summary
        type: text
        prompt: Summarize the implemented correction in English.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: changed-boundaries
        type: list
        prompt: List the changed product or contract boundaries in English.
        required: true
        min_items: 1
        max_items: 20
        max_item_length: 500
        max_total_length: 10000
        unique: true
  verification:
    type: action
    title: Verify the fix
    intent: Record a structurally bound external result for the current bug-fix candidate.
    instructions:
      - "Accountable role: Verifier. Use the current selected evidence and record the declared outputs against that basis."
      - Run the declared regression check and repository-authoritative surrounding verification outside Podway.
      - Record the caller-supplied result in English; Podway does not execute or attest the operation.
      - Report actual negative or incomplete results in the declared output fields. If a required result cannot be supplied, record a blocker with the missing facts.
    items:
      - id: verification-result
        type: check_result
        prompt: Record the caller-supplied result for bug-fix-verification; Podway does not execute or attest the operation.
        help: The declared operation is "Run the declared regression check and the repository-authoritative surrounding verification for the current bug fix in the recorded input basis." The matching digest identifies only this abstract slot contract and does not prove that any operation ran.
        required: true
        operation_id: bug-fix-verification
        operation_digest: sha256:01122b6057efcfa3f22c453aa48fb647ccba9f7db437dd44473a9f32a854a979
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  assess-evaluate-verification:
    type: action
    title: Assess evaluate the verification result
    intent: Report the current positive or negative basis for the Coordinator decision.
    instructions:
      - "Accountable role: affected Evaluator. Read selected checks, work and findings, identify any actual failure, and record the current verdict and stage."
      - Success advances immediately. Record not-scored and a zero placeholder for success at any entry.
      - Use the upcoming entry ordinal for this decision and selected group. First-entry failure receives ordinary local rework, the second receives lightweight screening, and each third or later failure receives scored assessment.
      - A concrete serious structural defect may receive an earlier scored assessment. Support every score with current facts, scope and provenance.
      - "Need to change DAG structure (50): 0 no structural defect, 10/20 preference or inefficiency, 30 unsuitable boundaries, 40 missing required dependency or verification route, 50 required delivery is impossible."
      - "Difficulty of local correction (30): 0 a viable local correction exists, 10 alternatives remain uninvestigated, 20 tried corrections failed but alternatives remain, 30 no viable local correction."
      - "Lack of progress (20): 0 no repeat or meaningful improvement, 10 repeated cause with partial progress, 20 three or more failure results without meaningful progress."
      - Scores below 80 prohibit replan. At or above 80, the Coordinator may replan, continue with a viable correction, or retain a blocker.
      - Reuse a prior applicable assessment only by recording current applicability and provenance. Report unavailable facts as a blocker if required output cannot be recorded.
      - Never manufacture a failure, inflate a score, or repeat a decision to increase its ordinal.
    items:
      - id: assessment-verdict
        type: choice
        prompt: Record success only when the selected evidence satisfies the next decision.
        required: true
        choices:
          - success
          - failure
      - id: assessment-stage
        type: choice
        prompt: Record the stage actually used on the current evidence.
        required: true
        choices:
          - not-scored
          - lightweight
          - scored
      - id: assessment-score
        type: integer
        prompt: Record the scored total, or a zero placeholder for an unscored assessment.
        required: true
        minimum: 0
        maximum: 100
      - id: screening
        type: text
        prompt: Record repeated cause, actual progress and remaining local alternatives.
        required: false
        required_when:
          - item: assessment-stage
            equals: lightweight
        min_length: 1
        max_length: 4000
        multiline: true
      - id: scored-basis
        type: text
        prompt: Record each component in increments of 10, its factual reason, and the current report reference or reuse basis.
        required: false
        required_when:
          - item: assessment-stage
            equals: scored
        min_length: 1
        max_length: 4000
        multiline: true
  verification-decision:
    type: decision
    title: Evaluate the verification result
    objective: Route the recorded candidate by its structurally bound external outcome.
    prompt: Does the current verification result permit review?
    evidence_guidance:
      - Read the selected result and compare its input basis with the current fix.
      - "Coordinator: read the current verdict, stage, ordinal and supporting evidence. Advance immediately on success."
      - On failure, use a viable local correction or the current guarded replan option. For every third or later failure, record the scored basis and explain the current route choice.
      - Settle modifying descendants and uncertain external operations before replanning. Record why and what work is retained. Block with concrete missing facts if no admitted route is viable.
      - Do not manufacture failures, repeat a decision without new evidence, inflate scores or replan to demonstrate the feature.
    options:
      - id: passed
        label: Verification passed
        criteria: The selected verification outcome is pass.
        guards:
          - evidence:
              scope: local
              node: verify
              item: verification-result
            field: outcome
            equals: pass
          - evidence:
              scope: local
              node: assess-evaluate-verification
              item: assessment-verdict
            equals: success
      - id: retry
        label: Verification retry required
        criteria: The selected verification outcome is fail or inconclusive.
        guards:
          - evidence:
              scope: local
              node: verify
              item: verification-result
            field: outcome
            not_equals: pass
          - evidence:
              scope: local
              node: assess-evaluate-verification
              item: assessment-verdict
            equals: failure
      - id: replan
        label: Return for a new plan
        criteria: The current failure has a scored assessment of at least 80 and the Coordinator justifies changing topology.
        guards:
          - evidence:
              scope: local
              node: assess-evaluate-verification
              item: assessment-verdict
            equals: failure
          - evidence:
              scope: local
              node: assess-evaluate-verification
              item: assessment-stage
            equals: scored
          - evidence:
              scope: local
              node: assess-evaluate-verification
              item: assessment-score
            at_least: 80
    reason:
      required: true
      prompt: Explain the selection using the recorded result in English.
  review-work:
    type: action
    title: Review the verified fix
    intent: Record the review result and bounded unresolved findings.
    instructions:
      - "Accountable role: independent Reviewer. Use the current selected evidence and record the declared outputs against that basis."
      - Review the diagnosis, fix, fresh verification, and goal boundary.
      - Record the summary, exact unresolved count, and findings in English.
      - Report actual negative or incomplete results in the declared output fields. If a required result cannot be supplied, record a blocker with the missing facts.
    items:
      - id: review-summary
        type: text
        prompt: Summarize the review result in English.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: unresolved-valid-findings
        type: integer
        prompt: Record the number of unresolved valid findings.
        required: true
        minimum: 0
      - id: review-findings
        type: list
        prompt: List bounded unresolved review findings in English, if any.
        required: false
        min_items: 0
        max_items: 20
        max_item_length: 500
        max_total_length: 10000
        unique: true
  assess-evaluate-review:
    type: action
    title: Assess evaluate the review result
    intent: Report the current positive or negative basis for the Coordinator decision.
    instructions:
      - "Accountable role: affected Evaluator. Read selected checks, work and findings, identify any actual failure, and record the current verdict and stage."
      - Success advances immediately. Record not-scored and a zero placeholder for success at any entry.
      - Use the upcoming entry ordinal for this decision and selected group. First-entry failure receives ordinary local rework, the second receives lightweight screening, and each third or later failure receives scored assessment.
      - A concrete serious structural defect may receive an earlier scored assessment. Support every score with current facts, scope and provenance.
      - "Need to change DAG structure (50): 0 no structural defect, 10/20 preference or inefficiency, 30 unsuitable boundaries, 40 missing required dependency or verification route, 50 required delivery is impossible."
      - "Difficulty of local correction (30): 0 a viable local correction exists, 10 alternatives remain uninvestigated, 20 tried corrections failed but alternatives remain, 30 no viable local correction."
      - "Lack of progress (20): 0 no repeat or meaningful improvement, 10 repeated cause with partial progress, 20 three or more failure results without meaningful progress."
      - Scores below 80 prohibit replan. At or above 80, the Coordinator may replan, continue with a viable correction, or retain a blocker.
      - Reuse a prior applicable assessment only by recording current applicability and provenance. Report unavailable facts as a blocker if required output cannot be recorded.
      - Never manufacture a failure, inflate a score, or repeat a decision to increase its ordinal.
    items:
      - id: assessment-verdict
        type: choice
        prompt: Record success only when the selected evidence satisfies the next decision.
        required: true
        choices:
          - success
          - failure
      - id: assessment-stage
        type: choice
        prompt: Record the stage actually used on the current evidence.
        required: true
        choices:
          - not-scored
          - lightweight
          - scored
      - id: assessment-score
        type: integer
        prompt: Record the scored total, or a zero placeholder for an unscored assessment.
        required: true
        minimum: 0
        maximum: 100
      - id: screening
        type: text
        prompt: Record repeated cause, actual progress and remaining local alternatives.
        required: false
        required_when:
          - item: assessment-stage
            equals: lightweight
        min_length: 1
        max_length: 4000
        multiline: true
      - id: scored-basis
        type: text
        prompt: Record each component in increments of 10, its factual reason, and the current report reference or reuse basis.
        required: false
        required_when:
          - item: assessment-stage
            equals: scored
        min_length: 1
        max_length: 4000
        multiline: true
  review-decision:
    type: decision
    title: Evaluate the review result
    objective: Route the fix by its exact non-negative unresolved finding count.
    prompt: Is the reviewed fix ready for goal assessment?
    evidence_guidance:
      - Read the selected summary, unresolved count, and findings.
      - "Coordinator: read the current verdict, stage, ordinal and supporting evidence. Advance immediately on success."
      - On failure, use a viable local correction or the current guarded replan option. For every third or later failure, record the scored basis and explain the current route choice.
      - Settle modifying descendants and uncertain external operations before replanning. Record why and what work is retained. Block with concrete missing facts if no admitted route is viable.
      - Do not manufacture failures, repeat a decision without new evidence, inflate scores or replan to demonstrate the feature.
    options:
      - id: approved
        label: Review approved
        criteria: No unresolved valid finding remains.
        guards:
          - evidence:
              scope: local
              node: review
              item: unresolved-valid-findings
            equals: 0
          - evidence:
              scope: local
              node: assess-evaluate-review
              item: assessment-verdict
            equals: success
      - id: changes-requested
        label: Changes requested
        criteria: At least one unresolved valid finding remains.
        guards:
          - evidence:
              scope: local
              node: review
              item: unresolved-valid-findings
            at_least: 1
          - evidence:
              scope: local
              node: assess-evaluate-review
              item: assessment-verdict
            equals: failure
      - id: replan
        label: Return for a new plan
        criteria: The current failure has a scored assessment of at least 80 and the Coordinator justifies changing topology.
        guards:
          - evidence:
              scope: local
              node: assess-evaluate-review
              item: assessment-verdict
            equals: failure
          - evidence:
              scope: local
              node: assess-evaluate-review
              item: assessment-stage
            equals: scored
          - evidence:
              scope: local
              node: assess-evaluate-review
              item: assessment-score
            at_least: 80
    reason:
      required: true
      prompt: Explain the selected route in English.
  return-group-result:
    type: action
    title: Return the completed group result
    intent: Return the declared current results for the base Procedure.
    instructions:
      - "Accountable role: Task Operator. Copy each bound result from the selected fresh evidence of this group and record the exact outputs for the base."
      - Do not turn a missing or failed result into success. If a declared result is unavailable, record the missing evidence and remain blocked.
    items:
      - id: verification-result
        type: check_result
        prompt: Record the caller-supplied result for bug-fix-verification; Podway does not execute or attest the operation.
        help: The declared operation is "Run the declared regression check and the repository-authoritative surrounding verification for the current bug fix in the recorded input basis." The matching digest identifies only this abstract slot contract and does not prove that any operation ran.
        required: true
        operation_id: bug-fix-verification
        operation_digest: sha256:01122b6057efcfa3f22c453aa48fb647ccba9f7db437dd44473a9f32a854a979
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
      - id: review-summary
        type: text
        prompt: Summarize the review result in English.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: unresolved-valid-findings
        type: integer
        prompt: Record the number of unresolved valid findings.
        required: true
        minimum: 0
graph:
  entry: diagnose
  nodes:
    - id: diagnose
      use: diagnosis
      evidence_from:
        - scope: plan
          required: true
          items:
            - reproduction-status
            - observed-behavior
            - expected-behavior
            - regression-check
      next: implement
    - id: implement
      use: implementation
      evidence_from:
        - scope: plan
          required: true
          items:
            - regression-check
        - scope: local
          node: diagnose
          required: true
          items:
            - cause
            - affected-boundary
      next: verify
    - id: verify
      use: verification
      evidence_from:
        - scope: local
          node: implement
          required: true
          items:
            - fix-summary
            - changed-boundaries
      next: assess-evaluate-verification
    - id: assess-evaluate-verification
      use: assess-evaluate-verification
      evidence_from:
        - scope: local
          node: verify
          required: true
          items:
            - verification-result
      next: evaluate-verification
    - id: evaluate-verification
      use: verification-decision
      evidence_from:
        - scope: local
          node: verify
          required: true
          items:
            - verification-result
        - scope: local
          node: assess-evaluate-verification
          required: true
          items:
            - assessment-verdict
            - assessment-stage
            - assessment-score
            - screening
            - scored-basis
      routes:
        passed:
          to: review
          effect: advance
        retry:
          to: implement
          effect: rework
        replan:
          effect: replan
    - id: review
      use: review-work
      evidence_from:
        - scope: local
          node: diagnose
          required: true
          items:
            - cause
            - affected-boundary
        - scope: local
          node: implement
          required: true
          items:
            - fix-summary
            - changed-boundaries
        - scope: local
          node: verify
          required: true
          items:
            - verification-result
      next: assess-evaluate-review
    - id: assess-evaluate-review
      use: assess-evaluate-review
      evidence_from:
        - scope: local
          node: review
          required: true
          items:
            - review-summary
            - unresolved-valid-findings
            - review-findings
      next: evaluate-review
    - id: evaluate-review
      use: review-decision
      evidence_from:
        - scope: local
          node: review
          required: true
          items:
            - review-summary
            - unresolved-valid-findings
            - review-findings
        - scope: local
          node: assess-evaluate-review
          required: true
          items:
            - assessment-verdict
            - assessment-stage
            - assessment-score
            - screening
            - scored-basis
      routes:
        approved:
          to: return-group-result
          effect: advance
        changes-requested:
          to: implement
          effect: rework
        replan:
          effect: replan
    - id: return-group-result
      use: return-group-result
      evidence_from:
        - scope: local
          node: verify
          required: true
          items:
            - verification-result
        - scope: local
          node: evaluate-review
          required: true
        - scope: local
          node: review
          required: true
          items:
            - review-summary
            - unresolved-valid-findings
      terminal: true
manual_rework:
  allowed_targets:
    - diagnose
    - implement
    - verify
    - review
plan_inputs:
  - id: reproduction-status
    type: choice
    prompt: Record whether the defect was reproduced.
    required: true
    choices:
      - reproduced
      - not-reproduced
  - id: observed-behavior
    type: text
    prompt: Record the observed behavior or reproduction limitation in English.
    required: true
    min_length: 1
    max_length: 4000
    multiline: true
  - id: expected-behavior
    type: text
    prompt: Record the expected behavior in English.
    required: true
    min_length: 1
    max_length: 2000
    multiline: true
  - id: regression-check
    type: text
    prompt: Record the regression commands actually run and their observed results in English, preserving exact commands verbatim. If they could not be run, record why.
    required: true
    min_length: 1
    max_length: 2000
    multiline: true
