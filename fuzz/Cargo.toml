[package]
name = "podway-fuzz"
version = "0.1.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
podway-protocol = { path = "../crates/podway-protocol" }
serde_json = "1.0.140"
podway-config = { path = "../crates/podway-config" }
podway-core = { path = "../crates/podway-core" }
podway-git = { path = "../crates/podway-git" }

[[bin]]
name = "workspace_config"
path = "fuzz_targets/workspace_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "item_record_many"
path = "fuzz_targets/item_record_many.rs"
test = false
doc = false
bench = false
[[bin]]
name = "canonical_json"
path = "fuzz_targets/canonical_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "selector"
path = "fuzz_targets/selector.rs"
test = false
doc = false
bench = false
[[bin]]
name = "output_v4"
path = "fuzz_targets/output_v4.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_procedure"
path = "fuzz_targets/config_procedure.rs"
test = false
doc = false
bench = false

[workspace]

[[bin]]
name = "delegation_accept"
path = "fuzz_targets/delegation_accept.rs"
