name: Native macOS Apple Silicon release final review

on:
  workflow_dispatch:
    inputs:
      arm64_qualification_run_id: { required: true, type: string }
      arm64_qualification_artifact_id: { required: true, type: string }
      arm64_qualification_bundle_sha256: { required: true, type: string }
      arm64_post_index_review_run_id: { required: true, type: string }
      arm64_post_index_review_artifact_id: { required: true, type: string }

permissions:
  actions: read
  contents: read

jobs:
  final-review:
    outputs:
      publication_handoff_artifact_id: ${{ steps.upload-handoff.outputs.artifact-id }}
      publication_handoff_sha256: ${{ steps.upload-handoff.outputs.artifact-digest }}
    runs-on: [self-hosted, macOS, ARM64, podway-release]
    environment: release-final-review
    timeout-minutes: 120
    env:
      G009_TARGET: arm64
      G009_TRIPLE: aarch64-apple-darwin
      G009_ARCH: arm64
      G009_RUNNER_ARCH: ARM64
      QUALIFICATION_RUN_ID: ${{ inputs.arm64_qualification_run_id }}
      QUALIFICATION_ARTIFACT_ID: ${{ inputs.arm64_qualification_artifact_id }}
      EXPECTED_BUNDLE_SHA256: ${{ inputs.arm64_qualification_bundle_sha256 }}
      POST_INDEX_REVIEW_RUN_ID: ${{ inputs.arm64_post_index_review_run_id }}
      POST_INDEX_REVIEW_ARTIFACT_ID: ${{ inputs.arm64_post_index_review_artifact_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Authenticate immutable qualification producer
        shell: bash
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          run_id=os.environ['QUALIFICATION_RUN_ID']; repo=os.environ['GITHUB_REPOSITORY']
          if not re.fullmatch(r'[1-9][0-9]*', run_id): raise SystemExit('invalid qualification run ID')
          request=Request(f"{os.environ['GITHUB_API_URL']}/repos/{quote(repo, safe='/')}/actions/runs/{run_id}",headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['ACTIONS_READ_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28'})
          try:
              with urlopen(request,timeout=30) as response: metadata=json.load(response)
          except (OSError, ValueError, json.JSONDecodeError) as exc: raise SystemExit('qualification run metadata request failed') from exc
          if not isinstance(metadata,dict) or metadata.get('repository',{}).get('id') != int(os.environ['GITHUB_REPOSITORY_ID']) or metadata.get('id') != int(run_id) or metadata.get('path') != '.github/workflows/release.yml' or metadata.get('event') != 'workflow_dispatch' or metadata.get('status') != 'completed' or metadata.get('conclusion') != 'success' or metadata.get('head_sha') != os.environ['GITHUB_WORKFLOW_SHA']: raise SystemExit('qualification producer identity is not trusted')
          nonce=hashlib.sha256(b'podway-g009-qualification-v2\0'+os.environ['GITHUB_REPOSITORY_ID'].encode('ascii')+b'\0'+run_id.encode('ascii')+b'\0.github/workflows/release.yml\0'+os.environ['GITHUB_WORKFLOW_SHA'].encode('ascii')).hexdigest()
          open(os.environ['GITHUB_ENV'],'a').write(f'QUALIFICATION_AUTHENTICATED_RUN_ID={run_id}\nQUALIFICATION_PRODUCING_WORKFLOW_SHA={metadata["head_sha"]}\nQUALIFICATION_INVOCATION_NONCE={nonce}\n')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: ${{ github.repository }}
          run-id: ${{ env.QUALIFICATION_AUTHENTICATED_RUN_ID }}
          artifact-ids: ${{ env.QUALIFICATION_ARTIFACT_ID }}
          github-token: ${{ github.token }}
          path: qualification-input
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: ${{ github.repository }}
          run-id: ${{ env.POST_INDEX_REVIEW_RUN_ID }}
          artifact-ids: ${{ env.POST_INDEX_REVIEW_ARTIFACT_ID }}
          github-token: ${{ github.token }}
          path: post-index-review
          merge-multiple: true
      - name: Verify exact native candidate and materialize review keyring
        shell: bash
        env:
          G009_REVIEWER_KEYRING_B64: ${{ secrets.G009_REVIEWER_KEYRING_B64 }}
          OWNER_FINGERPRINT: ${{ secrets.G009_OWNER_FINGERPRINT }}
          E_FINGERPRINT: ${{ secrets.G009_E_FINGERPRINT }}
          F_FINGERPRINT: ${{ secrets.G009_F_FINGERPRINT }}
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS; test "$RUNNER_ARCH" = "$G009_RUNNER_ARCH"; test "$(uname -m)" = "$G009_ARCH"
          test "$(git rev-parse HEAD)" = "${{ github.workflow_sha }}"
          python3 - <<'PY'
          import base64, hashlib, json, os, re, sys
          from pathlib import Path
          sys.path.insert(0,'tools'); from g009_common import require_native_host, target_tuple
          require_native_host(os.environ['G009_TRIPLE'])
          root=Path(os.environ['GITHUB_WORKSPACE']).resolve(); bundle=root/'qualification-input'/'qualification-bundle.json'
          if not bundle.is_file() or bundle.is_symlink() or not re.fullmatch(r'[0-9a-f]{64}',os.environ['EXPECTED_BUNDLE_SHA256']) or hashlib.sha256(bundle.read_bytes()).hexdigest()!=os.environ['EXPECTED_BUNDLE_SHA256']: raise SystemExit('qualification descriptor digest mismatch')
          value=json.loads(bundle.read_text()); expected=target_tuple(os.environ['G009_TRIPLE'])
          if value.get('schema')!='podway.g009.qualification-bundle/v1' or value.get('target')!=expected['triple'] or value.get('target_tuple')!=expected: raise SystemExit('missing, relabeled, translated, or universal target qualification')
          data=base64.b64decode(os.environ['G009_REVIEWER_KEYRING_B64'],validate=True)
          if not data: raise SystemExit('empty reviewer keyring')
          keyring=Path(os.environ['RUNNER_TEMP'])/'g009-reviewer-keyring.gpg'; keyring.write_bytes(data); keyring.chmod(0o400)
          Path(os.environ['GITHUB_ENV']).open('a').write(f'QUALIFICATION_BUNDLE_PATH={bundle}\nACCEPTANCE_INDEX_PATH={root / "qualification-input" / "acceptance-index.json"}\nREVIEWER_KEYRING_PATH={keyring}\nREVIEWER_KEYRING_SHA256={hashlib.sha256(data).hexdigest()}\n')
          PY
      - name: Produce and strictly verify final review
        shell: bash
        env:
          OWNER_FINGERPRINT: ${{ secrets.G009_OWNER_FINGERPRINT }}
          E_FINGERPRINT: ${{ secrets.G009_E_FINGERPRINT }}
          F_FINGERPRINT: ${{ secrets.G009_F_FINGERPRINT }}
        run: |
          set -euo pipefail
          attestations=(--attestation "owner=$GITHUB_WORKSPACE/post-index-review/owner-attestation.json=$GITHUB_WORKSPACE/post-index-review/owner-attestation.asc" --attestation "E=$GITHUB_WORKSPACE/post-index-review/E-attestation.json=$GITHUB_WORKSPACE/post-index-review/E-attestation.asc" --attestation "F=$GITHUB_WORKSPACE/post-index-review/F-attestation.json=$GITHUB_WORKSPACE/post-index-review/F-attestation.asc")
          reviewers=(--reviewer-fingerprint "owner=$OWNER_FINGERPRINT" --reviewer-fingerprint "E=$E_FINGERPRINT" --reviewer-fingerprint "F=$F_FINGERPRINT")
          read -r FINAL_REVIEW_PATH FINAL_REVIEW_SHA256 < <(python3 tools/run_g009_qualification.py final-review --qualification-bundle "$QUALIFICATION_BUNDLE_PATH" --reviewer-keyring "$REVIEWER_KEYRING_PATH" --reviewer-keyring-sha256 "$REVIEWER_KEYRING_SHA256" "${reviewers[@]}" "${attestations[@]}")
          read -r STRICT_VERIFIER_RECEIPT _ < <(python3 tools/verify_g009_qualification.py --qualification-bundle "$QUALIFICATION_BUNDLE_PATH" --final-review "$FINAL_REVIEW_PATH" --reviewer-keyring "$REVIEWER_KEYRING_PATH" --reviewer-keyring-sha256 "$REVIEWER_KEYRING_SHA256" --invocation-nonce "$QUALIFICATION_INVOCATION_NONCE" "${reviewers[@]}" "${attestations[@]}" --evidence-root artifacts/g009 --receipt-out artifacts/g009/strict-verifier.json)
          read -r FINAL_BUNDLE_PATH FINAL_BUNDLE_SHA256 < <(python3 tools/run_g009_qualification.py final-bundle --qualification-bundle "$QUALIFICATION_BUNDLE_PATH" --index "$ACCEPTANCE_INDEX_PATH" --review "$FINAL_REVIEW_PATH" --traceability release/g009-traceability-v1.json "${attestations[@]}" --strict-verifier-receipt "$STRICT_VERIFIER_RECEIPT" --output artifacts/g009/final-bundle/podway-g009-final-bundle.zip)
          export FINAL_BUNDLE_PATH FINAL_BUNDLE_SHA256
          python3 - <<'PY'
          import hashlib,json,os,re,zipfile
          from pathlib import Path
          final=Path(os.environ['FINAL_BUNDLE_PATH']); out=Path('publication-handoff'); out.mkdir()
          with zipfile.ZipFile(final) as outer:
              required={'qualification-bundle.json','qualification-bundle.zip','acceptance-index.json','final-review.json','traceability.json','release-policy.json','tool-manifest.json','strict-verifier-receipt.json','receipt.json','manifest.json','attestations/owner.payload','attestations/owner.signature','attestations/E.payload','attestations/E.signature','attestations/F.payload','attestations/F.signature'}
              names=outer.namelist()
              if len(names) != len(set(names)) or set(names) != required: raise SystemExit('final bundle member set drift')
              for name,dest in [('qualification-bundle.json','provenance-arm64.json'),('acceptance-index.json','acceptance-index-arm64.json'),('final-review.json','final-review-arm64.json'),('release-policy.json','release-policy.json'),('tool-manifest.json','controller-manifest.json'),('manifest.json','final-bundle-manifest.json')]: (out/dest).write_bytes(outer.read(name))
              qualification=outer.read('qualification-bundle.zip')
          provenance=json.loads((out/'provenance-arm64.json').read_text()); review=json.loads((out/'final-review-arm64.json').read_text())
          with zipfile.ZipFile(__import__('io').BytesIO(qualification)) as bundle:
              names=bundle.namelist()
              if names.count('archive.zip') != 1 or len(names) != len(set(names)): raise SystemExit('qualification archive member set drift')
              product=bundle.read('archive.zip')
          digest=hashlib.sha256(product).hexdigest(); archive=f'podway-{provenance["source"]["commit"]}-arm64-{digest}.zip'; (out/archive).write_bytes(product)
          sidecars=['provenance-arm64.json','acceptance-index-arm64.json','final-review-arm64.json','release-policy.json','controller-manifest.json','final-bundle-manifest.json','SHA256SUMS']
          sums=''.join(f'{hashlib.sha256((out/name).read_bytes()).hexdigest()}  {name}\n' for name in [archive,*sidecars[:-1]]); (out/'SHA256SUMS').write_text(sums)
          handoff={'schema':'podway.g009.publication-handoff/v1','controller_sha':os.environ['GITHUB_WORKFLOW_SHA'],'producing_workflow_sha':os.environ['QUALIFICATION_PRODUCING_WORKFLOW_SHA'],'checked_out_workflow_sha':os.environ['GITHUB_WORKFLOW_SHA'],'source':provenance['source'],'target':'aarch64-apple-darwin','target_tuple':provenance['target_tuple'],'product_archive':archive,'product_archive_sha256':digest,'final_bundle_sha256':os.environ['FINAL_BUNDLE_SHA256'],'final_bundle_manifest_sha256':hashlib.sha256((out/'final-bundle-manifest.json').read_bytes()).hexdigest(),'final_review_sha256':hashlib.sha256((out/'final-review-arm64.json').read_bytes()).hexdigest(),'release_policy_sha256':hashlib.sha256((out/'release-policy.json').read_bytes()).hexdigest(),'controller_manifest_sha256':hashlib.sha256((out/'controller-manifest.json').read_bytes()).hexdigest(),'reviewers':review['reviewers'],'attestations':review['attestations'],'sidecars':sidecars}
          (out/'publication-handoff.json').write_text(json.dumps(handoff,sort_keys=True,separators=(',',':'))+'\n')
          PY
      - id: upload-handoff
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: g019-publication-handoff-arm64
          path: publication-handoff
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
