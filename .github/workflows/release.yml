name: Native Apple Silicon release qualification

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Candidate full 40-character commit SHA
        required: true
        type: string
      candidate_tree:
        description: Candidate full 40-character Git tree SHA
        required: true
        type: string
      rc_run_id:
        description: Immutable same-repository RC producer run ID
        required: true
        type: string
      rc_artifact_id:
        description: Immutable same-repository RC input artifact ID
        required: true
        type: string
      rc_sha256:
        description: Expected lowercase SHA-256 of the RC intent
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  qualify:
    runs-on: [self-hosted, macOS, ARM64, podway-release]
    timeout-minutes: 420
    env:
      CARGO_BUILD_TARGET: aarch64-apple-darwin
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      RUSTUP_TOOLCHAIN: "1.85.0"
    defaults:
      run:
        working-directory: controller
    environment: release-qualification
    steps:
      - name: Check out the immutable controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false
          path: controller

      - name: Check out the separately selected candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_commit }}
          path: candidate
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Download immutable same-repository RC inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.rc_run_id }}
          artifact-ids: ${{ inputs.rc_artifact_id }}
          github-token: ${{ github.token }}
          path: ${{ github.workspace }}/immutable-inputs
          merge-multiple: true

      - name: Verify host, controller tools, and candidate provenance before execution
        shell: bash
        env:
          EXPECTED_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          EXPECTED_CANDIDATE_TREE: ${{ inputs.candidate_tree }}
          EXPECTED_RC_SHA256: ${{ inputs.rc_sha256 }}
          G009_QUALIFICATION_KEYRING_B64: ${{ secrets.G009_QUALIFICATION_KEYRING_B64 }}
          G009_QUALIFICATION_OWNER_FINGERPRINT: ${{ secrets.G009_QUALIFICATION_OWNER_FINGERPRINT }}
          G009_QUALIFICATION_E_FINGERPRINT: ${{ secrets.G009_QUALIFICATION_E_FINGERPRINT }}
          G009_QUALIFICATION_F_FINGERPRINT: ${{ secrets.G009_QUALIFICATION_F_FINGERPRINT }}
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          test "$(sysctl -in sysctl.proc_translated || true)" = 0
          test -n "$G009_QUALIFICATION_KEYRING_B64"
          test "$(git rev-parse HEAD)" = "${{ github.workflow_sha }}"
          test -f tools/run_g009_qualification.py
          test ! -L tools/run_g009_qualification.py
          python3 - <<'PY' >> "$GITHUB_ENV"
          import hashlib, os, re
          from pathlib import Path
          def require(name, pattern):
              value = os.environ[name]
              if not re.fullmatch(pattern, value): raise SystemExit(f"invalid {name}")
              return value
          commit = require("EXPECTED_CANDIDATE_COMMIT", r"[0-9a-f]{40}")
          require("EXPECTED_CANDIDATE_TREE", r"[0-9a-f]{40}")
          digest = require("EXPECTED_RC_SHA256", r"[0-9a-f]{64}")
          root = Path(os.environ["GITHUB_WORKSPACE"])
          candidate_lexical = root / "candidate"
          inputs_lexical = root / "immutable-inputs"
          controller_lexical = root / "controller"
          if candidate_lexical.is_symlink() or inputs_lexical.is_symlink() or controller_lexical.is_symlink(): raise SystemExit("unsafe artifact root")
          root = root.resolve()
          candidate = candidate_lexical.resolve(strict=True)
          if candidate == root or not candidate.is_relative_to(root): raise SystemExit("unsafe candidate root")
          inputs = inputs_lexical.resolve(strict=True)
          controller = controller_lexical.resolve(strict=True)
          if not inputs.is_relative_to(root) or not controller.is_relative_to(root) or controller == candidate: raise SystemExit("unsafe qualification topology")
          downloaded = inputs / f"{digest}.json"
          if not downloaded.is_file() or downloaded.is_symlink() or hashlib.sha256(downloaded.read_bytes()).hexdigest() != digest: raise SystemExit("RC digest binding failed")
          for path in inputs.rglob("*"):
              if path.is_symlink() or not path.resolve().is_relative_to(inputs): raise SystemExit("unsafe immutable input")
          evidence = controller / "artifacts" / "g009"
          evidence.mkdir(parents=True, exist_ok=True)
          if evidence.is_symlink() or not evidence.resolve().is_relative_to(root): raise SystemExit("unsafe evidence root")
          rc = evidence / f"{digest}.json"
          data = downloaded.read_bytes()
          try:
              descriptor = os.open(rc, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o444)
          except FileExistsError:
              if rc.is_symlink() or not rc.is_file() or rc.read_bytes() != data: raise SystemExit("immutable RC staging differs")
          else:
              with os.fdopen(descriptor, "wb") as handle:
                  handle.write(data)
                  handle.flush()
                  os.fsync(handle.fileno())
          print(f"RC_PATH={rc}")
          print(f"G009_IMMUTABLE_INPUT_ROOT={inputs}")
          print(f"G009_EXPECTED_RC_SHA256={digest}")
          keyring = controller / "artifacts" / "g009" / "qualification-reviewers.gpg"
          encoded = os.environ["G009_QUALIFICATION_KEYRING_B64"]
          try:
              material = __import__("base64").b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit("invalid qualification keyring secret") from exc
          if not material: raise SystemExit("empty qualification keyring secret")
          descriptor = os.open(keyring, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o400)
          with os.fdopen(descriptor, "wb") as handle:
              handle.write(material)
              handle.flush()
              os.fsync(handle.fileno())
          print(f"G009_QUALIFICATION_KEYRING={keyring}")
          print(f"G009_QUALIFICATION_KEYRING_SHA256={hashlib.sha256(material).hexdigest()}")
          for name in (
              "G009_QUALIFICATION_OWNER_FINGERPRINT",
              "G009_QUALIFICATION_E_FINGERPRINT",
              "G009_QUALIFICATION_F_FINGERPRINT",
          ):
              value = require(name, r"[0-9A-F]{40}")
              print(f"{name}={value}")
          PY
          test "$(/usr/bin/git -C "$GITHUB_WORKSPACE/candidate" rev-parse HEAD)" = "$EXPECTED_CANDIDATE_COMMIT"
          test "$(/usr/bin/git -C "$GITHUB_WORKSPACE/candidate" rev-parse 'HEAD^{tree}')" = "$EXPECTED_CANDIDATE_TREE"
          rustup toolchain install 1.85.0 --profile minimal
          rustup target add --toolchain 1.85.0 aarch64-apple-darwin
          [[ "$(rustc +1.85.0 -vV)" == *$'\nhost: aarch64-apple-darwin'* ]]
          printf 'G009_CANDIDATE_ROOT=%s\nBIN_DIR=%s\nARCHIVE_PATH=%s\n' \
            "$GITHUB_WORKSPACE/candidate" "$GITHUB_WORKSPACE/candidate/target/aarch64-apple-darwin/release" \
            "$GITHUB_WORKSPACE/candidate/dist/podway-0.1.0-aarch64-apple-darwin.zip" >> "$GITHUB_ENV"

      - name: Check current controller policy and expiry
        shell: bash
        run: |
          /usr/bin/git diff --exit-code -- .
          test "$(/usr/bin/git rev-parse HEAD)" = "${{ github.workflow_sha }}"
          python3 tools/verify_g009_qualification.py --protocol release/g009-qualification-v1.json --traceability release/g009-traceability-v1.json --crash-registry quality/crash-boundaries-v1.json

      - name: Build locked native candidate binaries
        shell: bash
        env:
          GITHUB_ENV: /dev/null
          GITHUB_PATH: /dev/null
          GITHUB_OUTPUT: /dev/null
          GITHUB_STEP_SUMMARY: /dev/null
        run: /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny file-write* (subpath "${{ github.workspace }}/controller"))(deny file-write* (subpath "${{ github.workspace }}/immutable-inputs"))' cargo +1.85.0 build --locked --release --target aarch64-apple-darwin --bins --manifest-path "$GITHUB_WORKSPACE/candidate/Cargo.toml"

      - name: Preflight immutable candidate and binary bindings
        shell: bash
        run: |
          /usr/bin/git diff --exit-code -- .
          python3 tools/run_g009_qualification.py preflight --rc "$RC_PATH"

      - name: Reject Intel Rosetta and universal output
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/git diff --exit-code -- .
          test "$(/usr/bin/git rev-parse HEAD)" = "${{ github.workflow_sha }}"
          for binary in "$BIN_DIR/podway" "$BIN_DIR/podwayd"; do test "$(lipo -archs "$binary")" = arm64; done

      - name: Execute exact 19 qualification gates
        shell: bash
        run: |
          /usr/bin/git diff --exit-code -- .
          python3 tools/run_g009_qualification.py full-gates --rc "$RC_PATH" --only G009-GATE-FORMAT,G009-GATE-CHECK,G009-GATE-CLIPPY,G009-GATE-NATIVE-TESTS,G009-GATE-CONTRACTS,G009-GATE-G005,G009-GATE-G008,G009-GATE-CRASH,G009-GATE-OBS,G009-GATE-FUZZ,G009-GATE-AUDIT,G009-GATE-DENY,G009-GATE-COVERAGE,G009-GATE-SECURITY,G009-GATE-MIGRATION

      - name: Run holdout package and lifecycle gates
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/git diff --exit-code -- .
          python3 tools/run_g009_qualification.py holdout --rc "$RC_PATH" --warmups 5 --samples 30 --bin-dir "$BIN_DIR"
          python3 tools/run_g009_qualification.py package --rc "$RC_PATH" --archive "$ARCHIVE_PATH" --bin-dir "$BIN_DIR"
          python3 tools/run_g009_qualification.py lifecycle --rc "$RC_PATH" --archive "$ARCHIVE_PATH" --require-clean-user

      - name: Create exact qualification acceptance index
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/git diff --exit-code -- .
          checkpoints=()
          for checkpoint in artifacts/g009/g009-gate-preflight/*.json artifacts/g009/g009-gate-gates/*.json artifacts/g009/g009-gate-performance/*.json artifacts/g009/g009-gate-package/*.json artifacts/g009/g009-gate-lifecycle/*.json; do test -f "$checkpoint"; checkpoints+=(--checkpoint "$checkpoint"); done
          read -r ACCEPTANCE_INDEX_PATH ACCEPTANCE_INDEX_SHA256 < <(python3 tools/run_g009_qualification.py acceptance-index --rc "$RC_PATH" --traceability release/g009-traceability-v1.json --evidence-root artifacts/g009 "${checkpoints[@]}")
          printf 'ACCEPTANCE_INDEX_PATH=%s\nACCEPTANCE_INDEX_SHA256=%s\n' "$ACCEPTANCE_INDEX_PATH" "$ACCEPTANCE_INDEX_SHA256" >> "$GITHUB_ENV"

      - name: Create content-addressed qualification bundle and receipt
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/git diff --exit-code -- .
          mkdir -p qualification-bundle
          read -r QUALIFICATION_DESCRIPTOR_PATH QUALIFICATION_DESCRIPTOR_SHA256 < <(python3 tools/run_g009_qualification.py qualification-bundle --rc "$RC_PATH" --traceability release/g009-traceability-v1.json --index "$ACCEPTANCE_INDEX_PATH" --archive "$ARCHIVE_PATH" --evidence-root artifacts/g009 --out qualification-bundle)
          test "$QUALIFICATION_DESCRIPTOR_PATH" = "$GITHUB_WORKSPACE/controller/qualification-bundle/qualification-bundle.json"
          printf 'QUALIFICATION_DESCRIPTOR_SHA256=%s\n' "$QUALIFICATION_DESCRIPTOR_SHA256" >> "$GITHUB_ENV"

      - name: Upload immutable qualification bundle
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: g019-qualification-${{ env.QUALIFICATION_DESCRIPTOR_SHA256 }}
          path: controller/qualification-bundle
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
