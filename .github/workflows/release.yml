name: Native Apple Silicon release qualification

on:
  workflow_dispatch:
    inputs:
      checkpoint:
        description: Qualification checkpoint to execute
        required: true
        type: choice
        options:
          - integration
          - native-rc
      rc_intent:
        description: Immutable G009 RC intent path
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    name: ${{ inputs.checkpoint }} qualification
    runs-on: [self-hosted, macOS, ARM64, podway-release]
    timeout-minutes: 420
    env:
      CARGO_BUILD_TARGET: aarch64-apple-darwin
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      RUSTUP_TOOLCHAIN: "1.85.0"

    steps:
      - name: Check out the immutable source revision
        uses: actions/checkout@v4

      - name: Reject non-native or translated hosts
        shell: bash
        run: |
          test "$RUNNER_OS" = "macOS"
          test "$RUNNER_ARCH" = "ARM64"
          test "$(uname -m)" = "arm64"
          test "$(sysctl -in sysctl.proc_translated || true)" = "0"

      - name: Install the frozen Rust release identity
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup target add --toolchain 1.85.0 aarch64-apple-darwin
          cargo +1.85.0 --version
          rustc +1.85.0 --version
          python3 - <<'PY'
          import subprocess

          metadata = subprocess.check_output(
              ["rustc", "+1.85.0", "-vV"], text=True
          )
          if "host: aarch64-apple-darwin" not in metadata:
              raise SystemExit("Rust 1.85.0 host is not native aarch64-apple-darwin")
          PY

      - name: Preflight the immutable qualification inputs
        shell: bash
        run: >-
          python3 tools/run_g009_qualification.py preflight
          --profile release/g009-qualification-v1.json
          --target aarch64-apple-darwin

      - name: Build locked native release binaries
        shell: bash
        run: cargo +1.85.0 build --locked --release --target aarch64-apple-darwin --bins

      - name: Reject Intel, Rosetta, and universal binary output
        shell: bash
        run: |
          for binary in target/aarch64-apple-darwin/release/podway target/aarch64-apple-darwin/release/podwayd; do
            test -f "$binary"
            test "$(lipo -archs "$binary")" = "arm64"
          done

      - name: Run bounded integration fuzz qualification
        if: ${{ inputs.checkpoint == 'integration' }}
        shell: bash
        run: >-
          python3 tools/run_g009_qualification.py full-gates
          --only fuzz-phase4
          --seconds 600
          --rc "${{ inputs.rc_intent }}"

      - name: Run bounded native RC fuzz qualification
        if: ${{ inputs.checkpoint == 'native-rc' }}
        shell: bash
        run: >-
          python3 tools/run_g009_qualification.py full-gates
          --only fuzz-native-rc
          --seconds 3600
          --rc "${{ inputs.rc_intent }}"

      - name: Package only after native RC qualification
        if: ${{ inputs.checkpoint == 'native-rc' }}
        shell: bash
        run: >-
          python3 tools/run_g009_qualification.py package
          --rc "${{ inputs.rc_intent }}"
          --archive dist/podway-0.1.0-aarch64-apple-darwin.zip

      - name: Require final verification before a native RC can pass
        if: ${{ inputs.checkpoint == 'native-rc' }}
        shell: bash
        run: >-
          python3 tools/run_g009_qualification.py verify-final
          --rc "${{ inputs.rc_intent }}"
          --archive dist/podway-0.1.0-aarch64-apple-darwin.zip
