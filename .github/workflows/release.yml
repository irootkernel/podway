name: Native Apple Silicon release qualification

on:
  workflow_dispatch:
    inputs:
      rc_intent:
        description: Immutable G009 RC intent under artifacts/g009/rc
        required: true
        type: string
      reviewer_primary:
        description: First named detached final reviewer
        required: true
        type: string
      reviewer_secondary:
        description: Second named detached final reviewer
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    name: Native Apple Silicon release qualification
    runs-on: [self-hosted, macOS, ARM64, podway-release]
    timeout-minutes: 420
    env:
      CARGO_BUILD_TARGET: aarch64-apple-darwin
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      RUSTUP_TOOLCHAIN: "1.85.0"

    steps:
      - name: Check out the immutable source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Reject non-native or translated hosts
        shell: bash
        run: |
          test "$RUNNER_OS" = "macOS"
          test "$RUNNER_ARCH" = "ARM64"
          test "$(uname -m)" = "arm64"
          test "$(sysctl -in sysctl.proc_translated || true)" = "0"

      - name: Install the frozen Rust release identity
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup target add --toolchain 1.85.0 aarch64-apple-darwin
          cargo +1.85.0 --version
          rustc +1.85.0 --version
          python3 - <<'PY'
          import subprocess

          metadata = subprocess.check_output(
              ["rustc", "+1.85.0", "-vV"], text=True
          )
          if "host: aarch64-apple-darwin" not in metadata:
              raise SystemExit("Rust 1.85.0 host is not native aarch64-apple-darwin")
          PY

      - name: Validate immutable workspace-local qualification inputs
        shell: bash
        env:
          RC_INTENT_INPUT: ${{ inputs.rc_intent }}
          REVIEWER_PRIMARY_INPUT: ${{ inputs.reviewer_primary }}
          REVIEWER_SECONDARY_INPUT: ${{ inputs.reviewer_secondary }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          rc_root = (workspace / "artifacts/g009/rc").resolve(strict=True)
          supplied = Path(os.environ["RC_INTENT_INPUT"])
          candidate = supplied if supplied.is_absolute() else workspace / supplied
          rc_path = candidate.resolve(strict=True)
          if (not rc_path.is_relative_to(rc_root) or rc_path.is_symlink()
                  or not rc_path.is_file()):
              raise SystemExit("RC intent must be a canonical, non-symlink file under artifacts/g009/rc")

          archive = workspace / "dist/podway-0.1.0-aarch64-apple-darwin.zip"
          archive_path = archive.resolve(strict=False)
          if archive_path != workspace / "dist/podway-0.1.0-aarch64-apple-darwin.zip":
              raise SystemExit("archive path must be the canonical workspace-local release artifact path")

          reviewers = [os.environ["REVIEWER_PRIMARY_INPUT"], os.environ["REVIEWER_SECONDARY_INPUT"]]
          if any(not reviewer.strip() or "\n" in reviewer or "\r" in reviewer for reviewer in reviewers):
              raise SystemExit("final reviewers must be non-empty single-line names")
          if reviewers[0] == reviewers[1]:
              raise SystemExit("final reviewers must be distinct")

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"RC_PATH={rc_path}\n")
              output.write(f"ARCHIVE_PATH={archive_path}\n")
              output.write(f"BIN_DIR={workspace / 'target/aarch64-apple-darwin/release'}\n")
              output.write(f"REVIEWER_PRIMARY={reviewers[0]}\n")
              output.write(f"REVIEWER_SECONDARY={reviewers[1]}\n")
          PY

      - name: Preflight the immutable qualification inputs
        shell: bash
        run: |
          python3 tools/run_g009_qualification.py preflight \
            --profile release/g009-qualification-v1.json \
            --target aarch64-apple-darwin

      - name: Build locked native release binaries
        shell: bash
        run: |
          cargo +1.85.0 build --locked --release --target aarch64-apple-darwin --bins

      - name: Reject Intel, Rosetta, and universal binary output
        shell: bash
        run: |
          for binary in "$BIN_DIR/podway" "$BIN_DIR/podwayd"; do
            test -f "$binary"
            test "$(lipo -archs "$binary")" = "arm64"
          done

      - name: Execute exact G009 profile gates
        shell: bash
        run: |
          for gate in \
            G009-GATE-FORMAT \
            G009-GATE-CHECK \
            G009-GATE-CLIPPY \
            G009-GATE-NATIVE-TESTS \
            G009-GATE-CONTRACTS \
            G009-GATE-G005 \
            G009-GATE-G008 \
            G009-GATE-CRASH \
            G009-GATE-OBS \
            G009-GATE-FUZZ \
            G009-GATE-AUDIT \
            G009-GATE-DENY \
            G009-GATE-COVERAGE \
            G009-GATE-SECURITY \
            G009-GATE-MIGRATION; do
            python3 tools/run_g009_qualification.py full-gates --rc "$RC_PATH" --only "$gate"
          done

      - name: Run the frozen unseen workload holdout
        shell: bash
        run: |
          python3 tools/run_g009_qualification.py holdout \
            --rc "$RC_PATH" \
            --warmups 5 \
            --samples 30 \
            --bin-dir "$BIN_DIR"

      - name: Package the RC-bound native binaries
        shell: bash
        run: |
          python3 tools/run_g009_qualification.py package \
            --rc "$RC_PATH" \
            --archive "$ARCHIVE_PATH" \
            --bin-dir "$BIN_DIR"

      - name: Validate the immutable release archive path
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          archive = Path(os.environ["ARCHIVE_PATH"])
          resolved = archive.resolve(strict=True)
          expected = (workspace / "dist/podway-0.1.0-aarch64-apple-darwin.zip").resolve(strict=True)
          if resolved != expected or archive.is_symlink() or not resolved.is_file():
              raise SystemExit("archive is not the canonical, non-symlink workspace-local release artifact")
          PY

      - name: Qualify clean-user lifecycle
        shell: bash
        run: |
          python3 tools/run_g009_qualification.py lifecycle \
            --rc "$RC_PATH" \
            --archive "$ARCHIVE_PATH" \
            --require-clean-user

      - name: Record final detached review
        shell: bash
        run: |
          python3 tools/run_g009_qualification.py final-review \
            --rc "$RC_PATH" \
            --traceability release/g009-traceability-v1.json \
            --evidence-root artifacts/g009 \
            --reviewer "$REVIEWER_PRIMARY" \
            --reviewer "$REVIEWER_SECONDARY" \
            --require-final-001
