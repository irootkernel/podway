schema: podway.procedure/v1
id: docs-only
version: "1"
name: Documentation Only
description: Documentation work grounded in sources, audience, validation, and review.
stages:
  - id: ground-sources
    title: Ground the sources
    instructions:
      - Identify authoritative source material before drafting.
    items:
      - id: authoritative-sources
        type: list
        prompt: List the authoritative sources used for this document.
        required: true
        min_items: 1
        max_items: 100
      - id: source-grounding-complete
        type: confirm
        prompt: Relevant source material was inspected.
        required: true
  - id: define-audience
    title: Define audience and outcome
    instructions:
      - Define the intended readers, outcome, and applicable terminology before outlining.
    items:
      - id: target-audience
        type: text
        prompt: Describe the target audience.
        required: true
        min_length: 1
      - id: intended-outcome
        type: text
        prompt: Describe what the reader should understand or do.
        required: true
        min_length: 1
      - id: terminology-conventions
        type: list
        prompt: Optionally list terminology or naming conventions.
        required: false
        max_items: 100
  - id: outline
    title: Create the outline
    instructions:
      - Organize the document into an ordered outline with clear scope boundaries.
    items:
      - id: outline-sections
        type: list
        prompt: List the planned document sections in order.
        required: true
        min_items: 1
        max_items: 100
      - id: scope-defined
        type: confirm
        prompt: In-scope and out-of-scope content are clear.
        required: true
  - id: draft
    title: Draft the document
    instructions:
      - Write a complete draft that serves the defined audience and intended outcome.
    items:
      - id: draft-complete
        type: confirm
        prompt: The complete draft exists.
        required: true
      - id: draft-reference
        type: artifact
        prompt: Optionally reference the draft file.
        required: false
  - id: validate
    title: Validate the document
    instructions:
      - Check the document's claims, instructions, links, examples, and references against sources.
    items:
      - id: factual-check-complete
        type: confirm
        prompt: Factual claims and technical instructions were checked against sources.
        required: true
      - id: links-examples-checked
        type: confirm
        prompt: Relevant links, examples, commands, and cross-references were checked.
        required: true
      - id: validation-note
        type: text
        prompt: Summarize validation and known limitations.
        required: true
        min_length: 1
  - id: review
    title: Review clarity and scope
    instructions:
      - Review the document for clarity, structure, audience fit, consistency, and resolved findings.
    items:
      - id: clarity-review-complete
        type: confirm
        prompt: The document was reviewed for clarity, structure, audience fit, and consistency.
        required: true
      - id: findings-resolved
        type: confirm
        prompt: Material review findings were resolved or explicitly accepted.
        required: true
      - id: review-note
        type: text
        prompt: Summarize the review outcome.
        required: true
        min_length: 1
  - id: finish
    title: Finish the document
    instructions:
      - Confirm the validated document is ready to deliver and summarize remaining limitations.
    items:
      - id: document-ready
        type: confirm
        prompt: The document is ready to deliver.
        required: true
      - id: final-summary
        type: text
        prompt: Summarize the delivered document and remaining limitations.
        required: true
        min_length: 1
rework:
  allow_return_to: any_previous
