schema: podway.procedure/v1
id: service-bug-fix
version: "1"
name: Service Bug Fix
stages:
  - id: reproduce
    title: Reproduce in a controlled environment
    items:
      - id: baseline-established
        type: confirm
        prompt: A controlled failing baseline was established.
        required: true
      - id: failure-description
        type: text
        prompt: Describe the failure and expected behavior.
        required: true
        min_length: 1
  - id: diagnose
    title: Diagnose
    items:
      - id: cause
        type: text
        prompt: State the diagnosed cause.
        required: true
        min_length: 1
  - id: implement
    title: Implement
    items:
      - id: implementation-complete
        type: confirm
        prompt: The fix implementation is complete.
        required: true
  - id: verify
    title: Verify
    items:
      - id: verification-passed
        type: confirm
        prompt: Relevant verification passed.
        required: true
      - id: verification-report
        type: artifact
        prompt: Reference the verification report.
        required: true
  - id: finish
    title: Finish
    items:
      - id: ready
        type: confirm
        prompt: The task result is ready.
        required: true
rework:
  allow_return_to:
    - reproduce
    - diagnose
    - implement
    - verify
